<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Order Now - Tasty Delight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="order.html" class="active">Order Now</a>

  <main class="order-section">
    <h2>Place Your Order</h2>
    <form id="orderForm">
      <input type="text" id="name" placeholder="Full Name">
      <input type="text" id="login" placeholder="Email or Phone Number">
      <input type="text" id="address" placeholder="Delivery Address">
      <input type="text" id="order" placeholder="What would you like to order?">
      <button type="button" onclick="input()">Place Order</button>
    </form>
    <p id="demo"></p>
  </main>

  <script src="script.js"></script>
